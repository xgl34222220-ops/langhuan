name: Apply compact creation UI

on:
  push:
    paths:
      - 'tools/apply_compact_creation_ui.py'
      - '.github/workflows/apply-compact-creation-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compact creation UI
        run: python tools/apply_compact_creation_ui.py
      - name: Commit UI refactor
        run: |
          git config user.name "xgl34222220-ops"
          git config user.email "xgl34222220@gmail.com"
          git add app/src/main/java/com/xiguli/langhuan/ui/ResearchNewBookConversationPage.kt app/src/main/java/com/xiguli/langhuan/ui/LanghuanRoot.kt app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: compact new-book chat UI"
            git push
          fi
