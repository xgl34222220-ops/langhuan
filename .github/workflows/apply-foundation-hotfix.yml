name: Apply foundation creation hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-foundation-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch creation flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/xiguli/langhuan/ui/NewBookConversation.kt')
          s = p.read_text()

          anchor = '    private var activeProviderId: String? = null\n'
          assert anchor in s, 'active provider field missing'
          if 'private var foundationJob:' not in s:
              s = s.replace(anchor, anchor + '    private var foundationJob: kotlinx.coroutines.Job? = null\n', 1)

          gen_start = s.index('    fun generateFoundation(regenerate: Boolean = false) {')
          gen_end = s.index('    fun createCurrentFoundation() {', gen_start)
          block = s[gen_start:gen_end]

          launch_anchor = '        viewModelScope.launch {'
          assert launch_anchor in block, 'generate launch missing'
          block = block.replace(launch_anchor, '        foundationJob = viewModelScope.launch {', 1)

          pattern = re.compile(
              r'''                val refreshed = ProposalConsolidator\(gateway\)\.consolidate\(\n'''
              r'''                    current = baseline,\n'''
              r'''                    messages = before\.messages,\n'''
              r'''                \)'''
          )
          replacement = '''                val refreshed = runCatching {
                    kotlinx.coroutines.withTimeout(75_000L) {
                        ProposalConsolidator(gateway).consolidate(
                            current = baseline,
                            messages = before.messages,
                        )
                    }
                }.getOrElse { baseline }'''
          block, count = pattern.subn(replacement, block, count=1)
          assert count == 1, 'consolidator call missing'

          block = block.replace('                        foundationStage = 3,', '                        foundationStage = inferFoundationStage(cleanFoundation).coerceAtLeast(1),', 1)
          block = block.replace(
              '                            "建书蓝图已经按整段会谈的最新决定分三阶段生成完成：核心世界与人物、第一卷详细章纲、伏笔计划都已对齐。",',
              '                            "当前有效蓝图已经保存。核心蓝图完成后即可正式建书；章纲或伏笔没补完也不会再把整本书锁死。",',
              1,
          )
          failure_old = '            }.onFailure { error ->\n                _state.update { it.copy(isBusy = false, busyLabel = "", error = friendlyAiError(error, "建书蓝图生成失败")) }\n            }'
          failure_new = '            }.onFailure { error ->\n                if (error !is kotlinx.coroutines.CancellationException) {\n                    _state.update { it.copy(isBusy = false, busyLabel = "", error = friendlyAiError(error, "建书蓝图生成失败")) }\n                }\n            }\n            foundationJob = null'
          assert failure_old in block, 'generation failure handler missing'
          block = block.replace(failure_old, failure_new, 1)
          s = s[:gen_start] + block + s[gen_end:]

          start = s.index('    fun createCurrentFoundation() {')
          end = s.index('    fun reset() {', start)
          replacement = '''    fun createCurrentFoundation() {
              var snapshot = _state.value
              val runningFoundation = foundationJob?.takeIf { it.isActive }
              if (snapshot.isBusy) {
                  if (runningFoundation == null) {
                      _state.update { it.copy(error = "AI 还在处理当前聊天，请等这一轮回复结束后再正式建书。") }
                      return
                  }
                  runningFoundation.cancel()
                  foundationJob = null
                  _state.update { it.copy(isBusy = false, busyLabel = "", error = null) }
                  snapshot = _state.value
              }

              val foundation = snapshot.foundation?.sanitizeFoundationPlaceholders() ?: return
              if (snapshot.blueprintDirty) {
                  _state.update { it.copy(error = "你在聊天里又改了要求，当前蓝图还没同步最新决定。请先同步当前聊天，再正式建书。") }
                  return
              }
              val stage = maxOf(snapshot.foundationStage, inferFoundationStage(foundation))
              if (stage < 1) {
                  _state.update { it.copy(error = "核心蓝图还没有形成。至少完成世界规则、核心人物和分卷后才能正式建书。") }
                  return
              }

              viewModelScope.launch {
                  _state.update {
                      it.copy(
                          foundation = foundation,
                          proposal = foundation.toProposal(),
                          foundationStage = stage,
                          blueprintDirty = false,
                          isBusy = true,
                          busyLabel = if (stage < 3) {
                              "正在用当前有效核心蓝图建书；未完成的章纲/伏笔可稍后补齐……"
                          } else {
                              "正在把蓝图写入小说圣经、三级大纲和长期记忆……"
                          },
                          error = null,
                      )
                  }
                  runCatching { foundationApplier.create(foundation) }
                      .onSuccess { created ->
                          suppressDraftPersistence = true
                          _state.update {
                              it.copy(
                                  isBusy = false,
                                  busyLabel = "",
                                  createdStoryId = created.snapshot.novel.id,
                                  messages = it.messages + CreationChatMessage(
                                      "assistant",
                                      if (stage >= 3) {
                                          "《${created.snapshot.novel.title}》已经正式建好。完整蓝图已经进入项目结构与长期记忆。"
                                      } else {
                                          "《${created.snapshot.novel.title}》已经正式建好。核心世界、人物和分卷已经写入项目；未完成的详细章纲/伏笔不会阻止开书，可以在项目里继续补齐。"
                                      },
                                  ),
                              )
                          }
                          draftStore.clear()
                      }.onFailure { error ->
                          _state.update { it.copy(isBusy = false, busyLabel = "", error = error.message ?: "正式建书失败") }
                      }
              }
          }

          '''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          p = Path('app/src/main/java/com/xiguli/langhuan/ui/ResearchNewBookConversationPage.kt')
          s = p.read_text()
          old = 'Button(onClick = onCreate, enabled = !busy && !outOfSync, modifier = Modifier.weight(1f)) { Icon(Icons.Rounded.CheckCircle, null); Text("正式建书") }'
          assert old in s, 'formal create button anchor missing'
          s = s.replace(
              old,
              'Button(onClick = onCreate, enabled = !outOfSync, modifier = Modifier.weight(1f)) { Icon(Icons.Rounded.CheckCircle, null); Text("正式建书") }',
              1,
          )
          p.write_text(s)
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "xgl34222220-ops"
          git config user.email "xgl34222220@gmail.com"
          git add app/src/main/java/com/xiguli/langhuan/ui/NewBookConversation.kt app/src/main/java/com/xiguli/langhuan/ui/ResearchNewBookConversationPage.kt
          git commit -m "fix: unblock formal book creation and partial blueprint recovery"
          git push origin HEAD:main
