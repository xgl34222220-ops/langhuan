name: Apply writing skills and chat UX

on:
  push:
    branches:
      - stage/writing-skills-chat-0271

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message == 'chore: add writing skills migration workflow'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/writing-skills-chat-0271
          fetch-depth: 0
      - name: Apply migration
        run: python .github/scripts/apply_writing_skills_chat.py
      - name: Verify temporary files removed
        run: |
          test ! -e .github/scripts/apply_writing_skills_chat.py
          test ! -e .github/workflows/apply-writing-skills-chat.yml
      - name: Commit staging result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add writing skills and conversation tail UX"
          git push origin HEAD:stage/writing-skills-chat-0271
