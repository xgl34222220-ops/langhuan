name: Wire Autonomous Planning

on:
  push:
    paths:
      - ".github/workflows/wire-autonomous-planning.yml"
      - ".github/scripts/wire_autonomous.py"

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire autonomous planning into app
        run: python3 .github/scripts/wire_autonomous.py
      - name: Commit wiring
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/xiguli/langhuan/ui/StudioViewModel.kt \
                  app/src/main/java/com/xiguli/langhuan/ui/AgentPage.kt \
                  app/src/main/java/com/xiguli/langhuan/engine/WorkspaceAiEngine.kt \
                  app/build.gradle.kts
          git commit -m "feat: wire autonomous long-form planning"
          git push origin HEAD:main
