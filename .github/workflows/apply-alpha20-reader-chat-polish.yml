name: Apply alpha20 reader chat polish

on:
  push:
    branches: [fix/alpha20-reader-chat-polish]
    paths:
      - '.github/workflows/apply-alpha20-reader-chat-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Apply production patch
        run: python3 .github/scripts/apply_alpha20_reader_chat_polish.py

      - name: Align regression contracts
        run: python3 .github/scripts/fix_alpha20_contracts.py

      - name: Test and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Commit result
        shell: bash
        run: |
          rm -f .github/workflows/apply-alpha20-reader-chat-polish.yml
          rm -f .github/scripts/apply_alpha20_reader_chat_polish.py
          rm -f .github/scripts/fix_alpha20_contracts.py
          git config user.name "xgl34222220-ops"
          git config user.email "xgl34222220@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: finish creation replies and mature reader UX alpha20"
          git push
