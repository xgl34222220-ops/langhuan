name: Apply alpha20 reader chat polish

on:
  push:
    branches: [fix/alpha20-reader-chat-polish]
    paths:
      - '.github/workflows/apply-alpha20-reader-chat-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Apply patch
        run: python3 .github/scripts/apply_alpha20_reader_chat_polish.py

      - name: Align regression contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          conversation = Path('app/src/main/java/com/xiguli/langhuan/ui/NewBookConversation.kt')
          text = conversation.read_text()
          if 'for (size in maxOverlap downTo 6)' not in text:
              raise SystemExit('continuation overlap source not found')
          conversation.write_text(text.replace('for (size in maxOverlap downTo 6)', 'for (size in maxOverlap downTo 3)', 1))

          alpha20 = Path('app/src/test/java/com/xiguli/langhuan/ui/ReaderChatAlpha20ContractTest.kt')
          text = alpha20.read_text().replace('app/src/main/', 'src/main/')
          alpha20.write_text(text)

          legacy = Path('app/src/test/java/com/xiguli/langhuan/ui/QingmoReplicaReaderContractTest.kt')
          text = legacy.read_text()
          old = '''        listOf(
            "排版预设", "主题", "字体", "字号", "行段", "定位",
            "上下翻页", "仿真翻页", "全文搜索", "音量键翻页", "屏幕常亮",
            "时间电量", "沉浸式", "点击动画", "下拉书签", "全屏下一页",
            "背景图遮罩", "背景跟随", "状态栏", "导航栏", "锁定竖屏",
        ).forEach { label -> assertTrue("missing reader action: $label", reader.contains("\\\"$label\\\"")) }'''
          new = '''        listOf(
            "排版预设", "主题", "字体", "字号", "行距页边距", "滚动阅读",
            "全文搜索", "音量键翻页", "屏幕常亮", "时间电量", "沉浸式", "锁定竖屏",
        ).forEach { label -> assertTrue("missing reader action: $label", reader.contains("\\\"$label\\\"")) }
        listOf(
            "定位", "上下翻页", "仿真翻页", "点击动画", "下拉书签", "全屏下一页",
            "背景图遮罩", "背景跟随", "状态栏", "导航栏",
        ).forEach { label -> assertFalse("legacy reader action still exposed: $label", reader.substringAfter("val actions = listOf(").substringBefore("LazyVerticalGrid").contains("\\\"$label\\\"")) }'''
          if old not in text:
              raise SystemExit('legacy action contract block not found')
          text = text.replace(old, new, 1)
          if 'snapPositionalThreshold = 0.15f' not in text:
              raise SystemExit('old pager threshold contract not found')
          text = text.replace('snapPositionalThreshold = 0.15f', 'snapPositionalThreshold = 0.32f', 1)
          legacy.write_text(text)
          PY

      - name: Test and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Commit result
        shell: bash
        run: |
          rm -f .github/workflows/apply-alpha20-reader-chat-polish.yml .github/scripts/apply_alpha20_reader_chat_polish.py
          git config user.name "xgl34222220-ops"
          git config user.email "xgl34222220@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: finish creation replies and mature reader UX alpha20"
          git push
