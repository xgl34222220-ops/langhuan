name: Wire Autonomous Execution

on:
  push:
    paths:
      - ".github/scripts/wire_autonomous_execution.py"
      - ".github/workflows/wire-autonomous-execution.yml"

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply execution wiring
        run: python3 .github/scripts/wire_autonomous_execution.py
      - name: Validate patch
        run: git diff --check
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/xiguli/langhuan/engine/ContextBuilder.kt \
                  app/src/main/java/com/xiguli/langhuan/engine/AutonomousStoryPlanner.kt \
                  app/src/main/java/com/xiguli/langhuan/ui/StudioViewModel.kt \
                  app/src/main/java/com/xiguli/langhuan/ui/AutonomousPlanPanel.kt \
                  app/build.gradle.kts
          git commit -m "feat: close autonomous plan execution loop"
          git push origin HEAD:main
