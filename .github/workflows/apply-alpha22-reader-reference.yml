name: Apply alpha22 reader reference density

# Retry 2: update stale reader contracts after the density redesign.
on:
  push:
    branches: [fix/alpha22-reader-reference-density]
    paths:
      - '.github/workflows/apply-alpha22-reader-reference.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Apply patch
        run: |
          python3 .github/scripts/apply_alpha22_reader_reference.py
          python3 .github/scripts/fix_alpha22_reader_contracts.py

      - name: Test and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Commit result
        shell: bash
        run: |
          git config user.name "xgl34222220-ops"
          git config user.email "xgl34222220@gmail.com"
          git add app
          git diff --cached --check
          git commit -m "fix: rebuild reader density from mature reader references alpha22"
          git push
