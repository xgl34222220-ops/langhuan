name: Android CI

on:
  push:
    branches: [main, test/reader-edition-20260930]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Run unit tests, Android lint and build Debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Record test identity and signing evidence
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          EVIDENCE=app/build/outputs/apk/debug/verification
          mkdir -p "$EVIDENCE"
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$TOOLS/aapt" dump badging "$APK" > "$EVIDENCE/apk-badging.txt"
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > "$EVIDENCE/apk-manifest.txt"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$EVIDENCE/apk-signing.txt"
          sha256sum "$APK" > "$EVIDENCE/SHA256SUMS.txt"
          grep "package: name='com.xiguli.langhuan'" "$EVIDENCE/apk-badging.txt"
          grep "application-label:'琅嬛'" "$EVIDENCE/apk-badging.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Langhuan-reader-test-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/verification
          if-no-files-found: error

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Langhuan-verification-reports
          path: app/build/reports
