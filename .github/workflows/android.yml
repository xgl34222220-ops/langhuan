name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: feat/shadcn-ui-rebuild-v1

      - name: Apply clean reader and story migration
        run: python tools/apply_clean_reader_story_round.py

      - name: Commit source migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm tools/apply_clean_reader_story_round.py
          git add app/src/main/java/com/xiguli/langhuan/ui/reader/ReaderExperience.kt app/src/main/java/com/xiguli/langhuan/ui/LanghuanRootV3.kt tools/apply_clean_reader_story_round.py
          git commit -m "fix(ui): keep reader stable and switch to clean story surface"
          git push origin HEAD:feat/shadcn-ui-rebuild-v1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Run unit tests and build Debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Langhuan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
