name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/shadcn-ui-rebuild-v1
          fetch-depth: 0

      - name: Apply Reader V14 source migration
        shell: bash
        run: |
          python3 .github/scripts/reader_v14_patch.py
          if [ "$(cat /tmp/reader_v14_changed)" = "1" ]; then
            git config user.name "langhuan-ui-bot"
            git config user.email "actions@users.noreply.github.com"
            git add app/src/main/java/com/xiguli/langhuan/ui/reader/ReaderExperience.kt app/src/main/java/com/xiguli/langhuan/ui/ReaderReadingStateV11.kt
            git diff --cached --check
            git commit -m "fix(reader): apply mature v14 page density"
            git push origin HEAD:feat/shadcn-ui-rebuild-v1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Run unit tests and build Debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Langhuan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
