name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/shadcn-ui-rebuild-v1
          fetch-depth: 0

      - name: Apply Reader V14 source migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          reader_path = Path('app/src/main/java/com/xiguli/langhuan/ui/reader/ReaderExperience.kt')
          s = reader_path.read_text(encoding='utf-8')
          changed = False

          def rep(old: str, new: str, count: int = 1):
              global s, changed
              actual = s.count(old)
              if actual != count:
                  raise SystemExit(f'expected {count}, found {actual}: {old[:140]!r}')
              s = s.replace(old, new, count)
              changed = True

          if 'ReaderPagedLayoutV14(' not in s:
              rep(
                  '    val prefs = remember(book.id) { context.getSharedPreferences("reader_settings_v2", Context.MODE_PRIVATE) }\n',
                  '    val prefs = remember(book.id) {\n'
                  '        context.getSharedPreferences("reader_settings_v2", Context.MODE_PRIVATE).also {\n'
                  '            migrateReaderTypographyV14(it, book.id)\n'
                  '        }\n'
                  '    }\n'
              )
              rep(
                  '    var lineFactor by remember(book.id) { mutableFloatStateOf(prefs.getFloat("line_${book.id}", 1.82f)) }\n',
                  '    var lineFactor by remember(book.id) { mutableFloatStateOf(prefs.getFloat("line_${book.id}", 1.68f)) }\n'
              )
              rep(
                  '    var paragraphSpacing by remember(book.id) { mutableFloatStateOf(prefs.getFloat("paragraph_${book.id}", 12f)) }\n',
                  '    var paragraphSpacing by remember(book.id) { mutableFloatStateOf(prefs.getFloat("paragraph_${book.id}", 8f)) }\n'
              )
              rep(
                  '    val readingText = remember(chapter.id, chapter.title, chapter.content) {\n'
                  '        readerBodyWithoutDuplicateHeadingV13(chapter.title, chapter.content).ifBlank { "这一章没有正文。" }\n'
                  '    }\n',
                  '    val readingText = remember(chapter.id, chapter.title, chapter.content) {\n'
                  '        readerNormalizeBodyV14(readerBodyWithoutDuplicateHeadingV13(chapter.title, chapter.content))\n'
                  '            .ifBlank { "这一章没有正文。" }\n'
                  '    }\n'
              )

              old_block = '''                            else -> {
                                val contentPage = contentPageFromPager(page)
                                Box(
                                    Modifier.fillMaxSize().background(palette.background)
                                        .clickable { chromeVisible = !chromeVisible }
                                        .padding(horizontal = sidePadding.dp)
                                        .padding(top = 22.dp, bottom = 48.dp),
                                ) {
                                    Column(Modifier.fillMaxSize()) {
                                        if (contentPage == 0) {
                                            ReaderChapterTitle(chapter, fontSize, family, palette)
                                            Spacer(Modifier.height(20.dp))
                                        }
                                        Text(
                                            formattedPageText(pages[contentPage], firstLineIndent, paragraphSpacing),
                                            modifier = Modifier.weight(1f),
                                            fontSize = fontSize.sp,
                                            lineHeight = (fontSize * lineFactor).sp,
                                            fontFamily = family,
                                            color = palette.foreground,
                                            overflow = TextOverflow.Clip,
                                        )
                                        Text(
                                            "${contentPage + 1}/${pages.size} · $displayTitle",
                                            Modifier.fillMaxWidth().padding(top = 4.dp),
                                            textAlign = TextAlign.End,
                                            style = MaterialTheme.typography.labelSmall,
                                            color = palette.secondary,
                                        )
                                    }
                                }
                            }
'''
              new_block = '''                            else -> {
                                val contentPage = contentPageFromPager(page)
                                val pageBookFraction = (
                                    (chapterIndex.toFloat() + (contentPage + 1f) / pages.size.coerceAtLeast(1).toFloat()) /
                                        ordered.size.coerceAtLeast(1).toFloat()
                                    ).coerceIn(0f, 1f)
                                ReaderPagedLayoutV14(
                                    pageText = pages[contentPage],
                                    contentPage = contentPage,
                                    pageCount = pages.size,
                                    displayTitle = displayTitle,
                                    fontSize = fontSize,
                                    lineFactor = lineFactor,
                                    sidePadding = sidePadding,
                                    paragraphSpacing = paragraphSpacing,
                                    firstLineIndent = firstLineIndent,
                                    family = family,
                                    background = palette.background,
                                    foreground = palette.foreground,
                                    secondary = palette.secondary,
                                    overallFraction = pageBookFraction,
                                    onToggleChrome = { chromeVisible = !chromeVisible },
                                )
                            }
'''
              rep(old_block, new_block)
              rep(
                  '            if (!chromeVisible) {\n'
                  '                val overall = ((chapterIndex.toFloat() + currentFraction()) / ordered.size.coerceAtLeast(1).toFloat()).coerceIn(0f, 1f)\n'
                  '                ReaderQuietFooter(Modifier.align(Alignment.BottomCenter), overall, palette)\n'
                  '            } else {\n',
                  '            if (!chromeVisible && pageMode == ReaderPageModeV10.SCROLL) {\n'
                  '                val overall = ((chapterIndex.toFloat() + currentFraction()) / ordered.size.coerceAtLeast(1).toFloat()).coerceIn(0f, 1f)\n'
                  '                ReaderQuietFooter(Modifier.align(Alignment.BottomCenter), overall, palette)\n'
                  '            } else if (chromeVisible) {\n'
              )
              rep(
                  '                                val offset = (chapter.content.length * value).roundToInt()\n',
                  '                                val offset = (readingText.length * value).roundToInt()\n'
              )
              rep('                        Spacer(Modifier.height(24.dp))\n', '                        Spacer(Modifier.height(16.dp))\n', 1)
              rep(
                  '    Text(readerDisplayChapterTitleV13(chapter.title, chapter.chapterNumber), fontSize = (fontSize + 5).sp, lineHeight = (fontSize + 11).sp, fontWeight = FontWeight.SemiBold, fontFamily = family, color = palette.foreground)\n',
                  '    Text(readerDisplayChapterTitleV13(chapter.title, chapter.chapterNumber), fontSize = (fontSize + 3).sp, lineHeight = (fontSize + 8).sp, fontWeight = FontWeight.SemiBold, fontFamily = family, color = palette.foreground)\n'
              )
              reader_path.write_text(s, encoding='utf-8')

          state_path = Path('app/src/main/java/com/xiguli/langhuan/ui/ReaderReadingStateV11.kt')
          t = state_path.read_text(encoding='utf-8')
          if 'lineFactor = 1.72f' not in t:
              replacements = [
                  ('    val paragraphSpacing: Float = 12f,\n', '    val paragraphSpacing: Float = 8f,\n'),
                  ('            lineFactor = prefs.getFloat("line_$bookId", 1.82f),\n', '            lineFactor = prefs.getFloat("line_$bookId", 1.68f),\n'),
                  ('            paragraphSpacing = prefs.getFloat("paragraph_$bookId", 12f),\n', '            paragraphSpacing = prefs.getFloat("paragraph_$bookId", 8f),\n'),
                  ('        lineFactor = 1.86f,\n        sidePadding = 24f,\n        paragraphSpacing = 13f,\n', '        lineFactor = 1.72f,\n        sidePadding = 24f,\n        paragraphSpacing = 8f,\n'),
                  ('        lineFactor = 1.82f,\n        sidePadding = 21f,\n        paragraphSpacing = 12f,\n', '        lineFactor = 1.70f,\n        sidePadding = 21f,\n        paragraphSpacing = 8f,\n'),
                  ('        lineFactor = 1.76f,\n        sidePadding = 27f,\n        paragraphSpacing = 14f,\n', '        lineFactor = 1.68f,\n        sidePadding = 27f,\n        paragraphSpacing = 9f,\n'),
                  ('        lineFactor = 1.66f,\n        sidePadding = 19f,\n        paragraphSpacing = 9f,\n', '        lineFactor = 1.62f,\n        sidePadding = 19f,\n        paragraphSpacing = 7f,\n'),
              ]
              for old, new in replacements:
                  count = t.count(old)
                  if count != 1:
                      raise SystemExit(f'state expected 1, found {count}: {old[:100]!r}')
                  t = t.replace(old, new, 1)
              state_path.write_text(t, encoding='utf-8')
              changed = True

          Path('/tmp/reader_v14_changed').write_text('1' if changed else '0')
          PY

          if [ "$(cat /tmp/reader_v14_changed)" = "1" ]; then
            git config user.name "langhuan-ui-bot"
            git config user.email "actions@users.noreply.github.com"
            git add app/src/main/java/com/xiguli/langhuan/ui/reader/ReaderExperience.kt app/src/main/java/com/xiguli/langhuan/ui/ReaderReadingStateV11.kt
            git diff --cached --check
            git commit -m "fix(reader): apply mature v14 page density"
            git push origin HEAD:feat/shadcn-ui-rebuild-v1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Run unit tests and build Debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Langhuan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
