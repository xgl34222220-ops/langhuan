name: Apply spatial UI phase 1

on:
  push:
    branches:
      - feat/threeui-motion-language
    paths:
      - .github/workflows/apply-threeui-phase1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Apply patch
        run: python3 .github/scripts/apply_threeui_phase1.py

      - name: Test and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Commit result
        run: |
          git config user.name xgl34222220-ops
          git config user.email xgl34222220@gmail.com
          git add -A
          git commit -m 'feat: introduce ThreeUI-inspired spatial motion language'
          git push origin HEAD:feat/threeui-motion-language
