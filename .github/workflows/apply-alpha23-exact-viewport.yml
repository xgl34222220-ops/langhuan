name: Apply alpha23 exact reader viewport

# Retry after aligning all reader contracts with exact viewport measurement.
on:
  push:
    branches: [fix/alpha23-reader-exact-viewport]
    paths:
      - '.github/workflows/apply-alpha23-exact-viewport.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Apply patch
        run: |
          python3 .github/scripts/apply_alpha23_exact_viewport.py
          python3 .github/scripts/fix_alpha23_contracts.py

      - name: Test and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Commit result
        shell: bash
        run: |
          git config user.name "xgl34222220-ops"
          git config user.email "xgl34222220@gmail.com"
          git add app
          git diff --cached --check
          git commit -m "fix: paginate reader from exact rendered viewport alpha23"
          git push
