name: Harden Resumable Run

on:
  push:
    branches: [stage/resumable-run-0266]
    paths:
      - tools/harden_resumable_run.py
      - .github/workflows/harden-resumable-run.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/resumable-run-0266
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/harden_resumable_run.py
      - name: Static checks
        run: |
          grep -q 'event.status in setOf(RunStatus.SUCCESS, RunStatus.SKIPPED)' app/src/main/java/com/xiguli/langhuan/engine/ChapterRunCoordinator.kt
          grep -q 'override suspend fun loadStory' app/src/test/java/com/xiguli/langhuan/engine/ChapterRunCoordinatorTest.kt
      - name: Commit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git diff --cached --quiet && exit 0
          git commit -m 'fix: harden resumable run checkpoints'
          git push origin HEAD:stage/resumable-run-0266
