name: Remove AI time limits

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-ai-time-limits.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove app-side AI time limits
        run: python3 tools/remove_ai_time_limits.py
      - name: Commit no-timeout behavior
        run: |
          git config user.name "xgl34222220-ops"
          git config user.email "xgl34222220@gmail.com"
          git add app/src/main/java/com/xiguli/langhuan/ui/ProgressiveFoundationEngine.kt app/src/main/java/com/xiguli/langhuan/ui/NewBookConversation.kt app/src/main/java/com/xiguli/langhuan/engine/UniversalAiGateway.kt app/build.gradle.kts
          git commit -m "fix: remove all app-side AI time limits"
          git push origin HEAD:main
