name: Finalize Candidate Guard

on:
  push:
    branches: [stage/candidate-canon-0263]
    paths:
      - '.github/scripts/finalize_candidate_guard.py'
      - '.github/workflows/finalize-candidate-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/candidate-canon-0263
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/finalize_candidate_guard.py
      - name: Validate
        run: |
          grep -q 'safeGenerated = generated.copy(stateChanges = emptyList())' app/src/main/java/com/xiguli/langhuan/data/PersistentStoryRepository.kt
          ! grep -q 'applyCharacterChanges(snapshot, generated.stateChanges' app/src/main/java/com/xiguli/langhuan/data/PersistentStoryRepository.kt
          grep -q '结构化事实将先进入 Candidate' app/src/main/java/com/xiguli/langhuan/ui/StudioViewModel.kt
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/xiguli/langhuan/data/PersistentStoryRepository.kt app/src/main/java/com/xiguli/langhuan/ui/StudioViewModel.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: route generated facts through Candidate Canon'
          git push origin HEAD:stage/candidate-canon-0263
