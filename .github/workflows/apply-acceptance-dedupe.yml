name: Apply acceptance dedupe

on:
  push:
    branches: [feat/model-telemetry]

permissions:
  contents: write

jobs:
  patch:
    if: "github.event.head_commit.message == 'chore: run acceptance dedupe'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/model-telemetry
          fetch-depth: 0
      - name: Apply acceptance idempotency
        run: python3 .github/scripts/dedupe_model_acceptance.py
      - name: Remove one-shot patch tooling
        run: git rm .github/scripts/dedupe_model_acceptance.py .github/workflows/apply-acceptance-dedupe.yml
      - name: Commit clean fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: dedupe model adoption telemetry"
          git push origin HEAD:feat/model-telemetry
