name: Fix creation chat and blueprint reliability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-creation-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Patch creation transport and retry behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gateway = Path('app/src/main/java/com/xiguli/langhuan/engine/UniversalAiGateway.kt')
          s = gateway.read_text()

          # A stream timeout before the first token is safe to retry once via the existing
          # non-streaming fallback. Only a stream that already emitted content must never replay.
          old = '''            if (error is SocketTimeoutException || error.cause is SocketTimeoutException) {
              throw IllegalStateException("AI 服务长时间没有返回数据，本次请求已停止；请重试或切换模型/中转站。", error)
            }
'''
          # Keep indentation-tolerant replacement because Kotlin source uses 12 spaces.
          pattern = re.compile(r'''\s{12}if \(error is SocketTimeoutException \|\| error\.cause is SocketTimeoutException\) \{\n\s{16}throw IllegalStateException\("AI 服务长时间没有返回数据，本次请求已停止；请重试或切换模型/中转站。", error\)\n\s{12}\}\n''')
          s, n = pattern.subn('', s, count=1)
          assert n == 1, 'stream timeout early-abort block not found'
          s = s.replace('import java.net.SocketTimeoutException\n', '')

          # Generation calls get a longer transport window; provider discovery keeps the short default.
          s = s.replace(
              'return requireSuccess(http(endpoint, "POST", authHeaders(protocol, config.apiKey), body.toString()))',
              'return requireSuccess(http(endpoint, "POST", authHeaders(protocol, config.apiKey), body.toString(), AI_RESPONSE_TIMEOUT_MS))',
              1,
          )
          s = s.replace(
              'return requireSuccess(http(anthropicMessagesEndpoint(config.baseUrl), "POST", authHeaders(ApiProtocol.ANTHROPIC, config.apiKey), body.toString()))',
              'return requireSuccess(http(anthropicMessagesEndpoint(config.baseUrl), "POST", authHeaders(ApiProtocol.ANTHROPIC, config.apiKey), body.toString(), AI_RESPONSE_TIMEOUT_MS))',
              1,
          )
          s = s.replace(
              '                geminiBody(prompt).toString(),\n            )',
              '                geminiBody(prompt).toString(),\n                AI_RESPONSE_TIMEOUT_MS,\n            )',
              1,
          )
          s = s.replace(
              '                ollamaBody(prompt, stream = false).toString(),\n            )',
              '                ollamaBody(prompt, stream = false).toString(),\n                AI_RESPONSE_TIMEOUT_MS,\n            )',
              1,
          )

          s = s.replace(
              'streamHttp(endpoint, authHeaders(protocol, config.apiKey), openAiBody(prompt, stream = true, azure = azure).toString()) { line ->',
              'streamHttp(endpoint, authHeaders(protocol, config.apiKey), openAiBody(prompt, stream = true, azure = azure).toString(), AI_STREAM_IDLE_TIMEOUT_MS) { line ->',
              1,
          )
          s = s.replace(
              '            anthropicBody(prompt, stream = true).toString(),\n        ) { line ->',
              '            anthropicBody(prompt, stream = true).toString(),\n            AI_STREAM_IDLE_TIMEOUT_MS,\n        ) { line ->',
              1,
          )
          s = s.replace(
              '            geminiBody(prompt).toString(),\n        ) { line ->',
              '            geminiBody(prompt).toString(),\n            AI_STREAM_IDLE_TIMEOUT_MS,\n        ) { line ->',
              1,
          )
          s = s.replace(
              'streamHttp(ollamaChatEndpoint(config.baseUrl), emptyMap(), ollamaBody(prompt, stream = true).toString()) { line ->',
              'streamHttp(ollamaChatEndpoint(config.baseUrl), emptyMap(), ollamaBody(prompt, stream = true).toString(), AI_STREAM_IDLE_TIMEOUT_MS) { line ->',
              1,
          )

          old_http = 'private suspend fun http(url: String, method: String, headers: Map<String, String>, body: String? = null): HttpResult =\n'
          new_http = 'private suspend fun http(url: String, method: String, headers: Map<String, String>, body: String? = null, readTimeoutMs: Int = READ_TIMEOUT_MS): HttpResult =\n'
          assert old_http in s, 'http signature not found'
          s = s.replace(old_http, new_http, 1)
          assert s.count('connection.readTimeout = READ_TIMEOUT_MS') == 1, 'unexpected normal read timeout count'
          s = s.replace('connection.readTimeout = READ_TIMEOUT_MS', 'connection.readTimeout = readTimeoutMs', 1)

          old_stream_sig = '''    body: String,
    onLine: (String) -> Unit,
) = runInterruptible(Dispatchers.IO) {'''
          new_stream_sig = '''    body: String,
    readTimeoutMs: Int = STREAM_IDLE_TIMEOUT_MS,
    onLine: (String) -> Unit,
) = runInterruptible(Dispatchers.IO) {'''
          assert old_stream_sig in s, 'streamHttp signature not found'
          s = s.replace(old_stream_sig, new_stream_sig, 1)
          assert s.count('connection.readTimeout = STREAM_IDLE_TIMEOUT_MS') == 1, 'unexpected stream timeout count'
          s = s.replace('connection.readTimeout = STREAM_IDLE_TIMEOUT_MS', 'connection.readTimeout = readTimeoutMs', 1)

          old_constants = '''private const val CONNECT_TIMEOUT_MS = 20_000
private const val READ_TIMEOUT_MS = 90_000
private const val STREAM_IDLE_TIMEOUT_MS = 120_000
'''
          new_constants = '''private const val CONNECT_TIMEOUT_MS = 20_000
private const val READ_TIMEOUT_MS = 90_000
private const val STREAM_IDLE_TIMEOUT_MS = 120_000
// Creation chat / blueprint calls may use slow reasoning models. These are finite, cancellable
// transport windows, not whole-task deadlines. Long-form chapter runtime still owns its own limits.
private const val AI_RESPONSE_TIMEOUT_MS = 300_000
private const val AI_STREAM_IDLE_TIMEOUT_MS = 300_000
'''
          assert old_constants in s, 'timeout constants not found'
          s = s.replace(old_constants, new_constants, 1)
          gateway.write_text(s)

          chat = Path('app/src/main/java/com/xiguli/langhuan/ui/NewBookConversation.kt')
          s = chat.read_text()

          old_history = '''        val userText = clean.ifBlank { defaultAttachmentInstruction(before.pendingAttachments) }
        val history = before.messages + CreationChatMessage("user", userText, before.pendingAttachments)
'''
          new_history = '''        val userText = clean.ifBlank { defaultAttachmentInstruction(before.pendingAttachments) }
        // A failed turn is already persisted in the conversation. If the user taps send again with
        // the same text, retry that turn instead of appending an identical black message card.
        val retryMessage = before.messages.lastOrNull()?.takeIf { message ->
            before.error != null &&
                message.role == "user" &&
                before.pendingAttachments.isEmpty() &&
                message.text.substringBefore(RESEARCH_CONTEXT_MARKER).trim() == userText.substringBefore(RESEARCH_CONTEXT_MARKER).trim()
        }
        val turnAttachments = retryMessage?.attachments ?: before.pendingAttachments
        val history = if (retryMessage != null) before.messages
        else before.messages + CreationChatMessage("user", userText, turnAttachments)
'''
          assert old_history in s, 'chat history block not found'
          s = s.replace(old_history, new_history, 1)
          assert 'attachmentPurposes = before.pendingAttachments.map(::attachmentPurpose),' in s
          s = s.replace('attachmentPurposes = before.pendingAttachments.map(::attachmentPurpose),', 'attachmentPurposes = turnAttachments.map(::attachmentPurpose),', 1)

          old_failure = '''            }.onFailure { error ->
                emitRun(RunStage.CREATION_CHAT, RunStatus.FAILED, "${routeDecision.intent.label} · ${error.message.orEmpty()}")
                _state.update {
                    it.copy(
                        isBusy = false,
                        busyLabel = "",
                        streamingReply = "",
                        lastRouteDecision = routeDecision.copy(status = NovelRouteStatus.FAILED),
                        lastExecutionPlan = executionPlan.copy(status = NovelRouteStatus.FAILED),
                        error = friendlyAiError(error, if (referenceQuestion) "模板事实读取失败" else "AI 构思失败"),
                    )
                }
            }
'''
          new_failure = '''            }.onFailure { error ->
                emitRun(RunStage.CREATION_CHAT, RunStatus.FAILED, "${routeDecision.intent.label} · ${error.message.orEmpty()}")
                val partialReply = _state.value.streamingReply.trim()
                _state.update {
                    it.copy(
                        messages = if (partialReply.isBlank()) it.messages else it.messages + CreationChatMessage(
                            "assistant",
                            "$partialReply\\n\\n（连接中断，已保留已返回内容；继续发送要求即可从这里往下接。）",
                        ),
                        isBusy = false,
                        busyLabel = "",
                        streamingReply = "",
                        lastRouteDecision = routeDecision.copy(status = NovelRouteStatus.FAILED),
                        lastExecutionPlan = executionPlan.copy(status = NovelRouteStatus.FAILED),
                        error = friendlyAiError(error, if (referenceQuestion) "模板事实读取失败" else "AI 构思失败"),
                    )
                }
            }
'''
          assert old_failure in s, 'chat failure block not found'
          s = s.replace(old_failure, new_failure, 1)

          old_error = '''private fun friendlyAiError(error: Throwable, fallback: String): String {
    val message = error.message.orEmpty(); val timeout = message.contains("timed out", true) || message.contains("timeout", true) || message.contains("超时")
    return if (timeout) "$fallback：AI 服务或中转站主动返回了超时/断开。琅嬛本身没有设置生成倒计时，也没有因为等待时间过长主动终止请求。" else message.ifBlank { fallback }
}
'''
          new_error = '''private fun friendlyAiError(error: Throwable, fallback: String): String {
    val message = error.message.orEmpty()
    val localSocketTimeout = error is java.net.SocketTimeoutException || error.cause is java.net.SocketTimeoutException
    val timeoutText = message.contains("timed out", true) || message.contains("timeout", true) || message.contains("超时")
    return when {
        localSocketTimeout -> "$fallback：等待模型返回超过当前网络容错时间。当前会谈与蓝图断点已保留，可直接重试；连续出现时请切换更稳定的模型或中转站。"
        timeoutText -> "$fallback：AI 服务或中转站返回了超时/断开：${message.take(260)}"
        else -> message.ifBlank { fallback }
    }
}
'''
          assert old_error in s, 'friendly error block not found'
          s = s.replace(old_error, new_error, 1)
          chat.write_text(s)

          foundation = Path('app/src/main/java/com/xiguli/langhuan/ui/ProgressiveFoundationEngine.kt')
          s = foundation.read_text()
          old_optional = '''    private suspend fun requestOptional(stage: String, prompt: PromptBundle): GeneratedChapter? = try {
        gateway.generate(prompt)
    } catch (cancelled: kotlinx.coroutines.CancellationException) {
        throw cancelled
    } catch (_: Throwable) {
        null
    }
'''
          new_optional = '''    private suspend fun requestOptional(stage: String, prompt: PromptBundle): GeneratedChapter? = try {
        gateway.generate(prompt)
    } catch (cancelled: kotlinx.coroutines.CancellationException) {
        throw cancelled
    } catch (error: Throwable) {
        // Core world/cast is mandatory. Do not silently turn a transport failure into a malformed
        // blueprint; surface it and keep the last checkpoint so retry can resume cleanly.
        if (stage.startsWith("1/3")) {
            throw IllegalStateException("$stage 请求失败：${error.message.orEmpty()}", error)
        }
        null
    }
'''
          assert old_optional in s, 'foundation optional request block not found'
          s = s.replace(old_optional, new_optional, 1)
          foundation.write_text(s)

          build = Path('app/build.gradle.kts')
          s = build.read_text()
          s = re.sub(r'versionCode = \d+', 'versionCode = 94', s, count=1)
          s = re.sub(r'versionName = "[^"]+"', 'versionName = "0.28.0-alpha15-creation-hotfix"', s, count=1)
          build.write_text(s)

          # Remove this one-shot workflow from the resulting source tree.
          Path('.github/workflows/fix-creation-hotfix.yml').unlink()
          PY

      - name: Run regression tests and build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Commit hotfix
        id: commit
        shell: bash
        run: |
          git config user.name 'xgl34222220-ops'
          git config user.email 'xgl34222220@gmail.com'
          git add -A
          git commit -m 'fix: restore reliable creation chat and blueprint flow'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish hotfix prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          VERSION='0.28.0-alpha15-creation-hotfix'
          TAG="v$VERSION"
          ASSET="Langhuan-$VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --target "$SHA" \
              --title "琅嬛 $VERSION" \
              --notes "修复创作聊天/建书蓝图在慢思考模型与中转站下频繁超时的问题：首段未返回时允许一次安全回退；已开始流式返回则不重复请求；失败保留已返回内容与蓝图断点；重复重试不再插入相同用户消息；核心蓝图网络失败不再静默吞掉。" \
              --prerelease
          fi
