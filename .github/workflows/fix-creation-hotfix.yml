name: Fix creation chat and blueprint reliability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-creation-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Apply hotfix
        run: python3 tools/hotfix_creation_reliability.py

      - name: Run tests and build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Commit hotfix
        id: commit
        shell: bash
        run: |
          rm -f tools/hotfix_creation_reliability.py .github/workflows/fix-creation-hotfix.yml
          git config user.name 'xgl34222220-ops'
          git config user.email 'xgl34222220@gmail.com'
          git add -A
          git commit -m 'fix: restore reliable creation chat and blueprint flow'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish hotfix prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          VERSION='0.28.0-alpha15-creation-hotfix'
          TAG="v$VERSION"
          ASSET="Langhuan-$VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --target "$SHA" --title "琅嬛 $VERSION" --notes "修复创作聊天与建书蓝图在慢思考模型/中转站下频繁超时的问题；首段未返回时允许一次安全回退，已开始流式返回则不重复请求；失败保留已返回内容与蓝图断点；重复重试不再插入相同用户消息；核心蓝图网络失败不再静默吞掉。" --prerelease
          fi
