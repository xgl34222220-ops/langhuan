name: Fix creation reliability alpha19

on:
  push:
    branches: [fix/creation-reliability-alpha19]
    paths:
      - '.github/workflows/fix-creation-reliability-alpha19.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Apply creation reliability fixes
        run: |
          python3 .github/scripts/fix_creation_reliability_alpha19.py
          python3 .github/scripts/fix_creation_reliability_alpha19_compile.py

      - name: Verify
        run: |
          git diff --check
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Commit verified app changes
        run: |
          git config user.name "xgl34222220-ops"
          git config user.email "xgl34222220@gmail.com"
          git rm .github/scripts/fix_creation_reliability_alpha19.py .github/scripts/fix_creation_reliability_alpha19_compile.py .github/workflows/fix-creation-reliability-alpha19.yml
          git add app
          git diff --cached --check
          git commit -m "fix: make creation chat and blueprint reliably retryable"
          git push origin HEAD:fix/creation-reliability-alpha19
