name: Apply Run Inspector Streaming

on:
  push:
    branches: [stage/run-inspector-streaming-0264]
    paths:
      - 'tools/apply_run_inspector_streaming.py'
      - '.github/workflows/apply-run-inspector-streaming.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/run-inspector-streaming-0264
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/apply_run_inspector_streaming.py
      - name: Validate wiring
        run: |
          grep -q 'generateTextStreaming' app/src/main/java/com/xiguli/langhuan/engine/GenerationPipeline.kt
          grep -q 'override suspend fun generateTextStreaming' app/src/main/java/com/xiguli/langhuan/engine/UniversalAiGateway.kt
          grep -q 'val runEvents: List<RunEvent>' app/src/main/java/com/xiguli/langhuan/ui/StudioViewModel.kt
          grep -q 'RunInspectorPanel(state.runEvents' app/src/main/java/com/xiguli/langhuan/ui/LanghuanApp.kt
          grep -q 'val streamingReply: String' app/src/main/java/com/xiguli/langhuan/ui/NewBookConversation.kt
          grep -q 'RunInspectorPanel(state.runEvents' app/src/main/java/com/xiguli/langhuan/ui/ResearchNewBookConversationPage.kt
          grep -q 'versionName = "0.26.4-alpha01"' app/build.gradle.kts
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/xiguli/langhuan/engine/GenerationPipeline.kt \
                  app/src/main/java/com/xiguli/langhuan/engine/UniversalAiGateway.kt \
                  app/src/main/java/com/xiguli/langhuan/ui/StudioViewModel.kt \
                  app/src/main/java/com/xiguli/langhuan/ui/LanghuanApp.kt \
                  app/src/main/java/com/xiguli/langhuan/ui/NewBookConversation.kt \
                  app/src/main/java/com/xiguli/langhuan/ui/ResearchNewBookConversationPage.kt \
                  app/build.gradle.kts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: add true streaming and run inspector'
          git push origin HEAD:stage/run-inspector-streaming-0264
