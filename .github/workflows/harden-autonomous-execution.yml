name: Harden Autonomous Execution

on:
  push:
    paths:
      - ".github/scripts/harden_autonomous_execution.py"
      - ".github/workflows/harden-autonomous-execution.yml"

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hardening
        run: python3 .github/scripts/harden_autonomous_execution.py
      - name: Validate patch
        run: git diff --check
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/xiguli/langhuan/engine/AutonomousExecutionEngine.kt \
                  app/src/test/java/com/xiguli/langhuan/engine/AutonomousExecutionEngineTest.kt
          git commit -m "fix: harden narrative debt and reveal budgets"
          git push origin HEAD:main
