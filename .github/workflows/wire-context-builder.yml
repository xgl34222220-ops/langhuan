name: Wire Context Builder

on:
  push:
    paths:
      - ".github/workflows/wire-context-builder.yml"

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Route RAG through Context Builder D layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/xiguli/langhuan/ui/StudioViewModel.kt")
          text = path.read_text(encoding="utf-8")
          start_marker = "            val memories = repository.retrieveRelevantMemories(current.snapshot.novel.id, ragQuery, current.draft.chapterNumber, 8)\n"
          end_marker = "            }.onSuccess { result -> _state.update { it.copy(isGenerating = false, streamPreview = result.chapter.content, result = result) }\n"
          start = text.find(start_marker)
          end_start = text.find(end_marker, start)
          if start < 0 or end_start < 0:
              raise SystemExit("legacy RAG injection range not found")
          end = end_start + len(end_marker)
          new = "\n".join([
              "            val retrievedContext = repository.retrieveRelevantContext(",
              "                current.snapshot.novel.id,",
              "                ragQuery,",
              "                current.draft.chapterNumber,",
              "                10,",
              "            )",
              "            val gateway = configuredGateway() ?: DemoAiGateway()",
              "            runCatching {",
              "                GenerationPipeline(gateway).generate(",
              "                    request = GenerationRequest(current.snapshot, current.draft, 2_500),",
              "                    retrievedContext = retrievedContext,",
              "                ) { preview ->",
              "                    _state.update { state -> state.copy(streamPreview = preview) }",
              "                }",
              "            }.onSuccess { result -> _state.update { it.copy(isGenerating = false, streamPreview = result.chapter.content, result = result) }",
              "",
          ])
          text = text[:start] + new + text[end:]
          if "snapshotForPrompt" in text:
              raise SystemExit("legacy snapshotForPrompt path still present")
          if "retrieveRelevantMemories(current.snapshot.novel.id, ragQuery" in text:
              raise SystemExit("legacy memory retrieval call still present")
          if "retrievedContext = retrievedContext" not in text:
              raise SystemExit("new Context Builder route missing")
          path.write_text(text, encoding="utf-8")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/xiguli/langhuan/ui/StudioViewModel.kt
          git commit -m "fix: route RAG through context builder"
          git push origin HEAD:main
