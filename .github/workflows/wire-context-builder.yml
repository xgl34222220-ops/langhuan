name: Wire Context Builder

on:
  push:
    paths:
      - ".github/workflows/wire-context-builder.yml"

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Route RAG through Context Builder D layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/xiguli/langhuan/ui/StudioViewModel.kt")
          lines = path.read_text(encoding="utf-8").splitlines()
          out = []
          replaced_retrieval = False
          removed_snapshot = False
          replaced_pipeline = False

          for line in lines:
              stripped = line.strip()
              indent = line[:len(line) - len(line.lstrip())]

              if "val memories = repository.retrieveRelevantMemories(" in line:
                  out.extend([
                      indent + "val retrievedContext = repository.retrieveRelevantContext(",
                      indent + "    current.snapshot.novel.id,",
                      indent + "    ragQuery,",
                      indent + "    current.draft.chapterNumber,",
                      indent + "    10,",
                      indent + ")",
                  ])
                  replaced_retrieval = True
                  continue

              if "val snapshotForPrompt = current.snapshot.copy(" in line:
                  removed_snapshot = True
                  continue

              if "GenerationPipeline(gateway).generate(GenerationRequest(snapshotForPrompt, current.draft, 2_500)) { preview ->" in line:
                  out.extend([
                      indent + "GenerationPipeline(gateway).generate(",
                      indent + "    request = GenerationRequest(current.snapshot, current.draft, 2_500),",
                      indent + "    retrievedContext = retrievedContext,",
                      indent + ") { preview ->",
                  ])
                  replaced_pipeline = True
                  continue

              out.append(line)

          patched = "\n".join(out) + "\n"
          if not (replaced_retrieval and removed_snapshot and replaced_pipeline):
              raise SystemExit(
                  f"patch incomplete retrieval={replaced_retrieval} snapshot={removed_snapshot} pipeline={replaced_pipeline}"
              )
          if "snapshotForPrompt" in patched:
              raise SystemExit("legacy snapshotForPrompt path still present")
          if "retrieveRelevantMemories(current.snapshot.novel.id" in patched:
              raise SystemExit("legacy memory retrieval call still present")
          if "retrievedContext = retrievedContext" not in patched:
              raise SystemExit("new Context Builder route missing")

          path.write_text(patched, encoding="utf-8")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/xiguli/langhuan/ui/StudioViewModel.kt
          git commit -m "fix: route RAG through context builder"
          git push origin HEAD:main
