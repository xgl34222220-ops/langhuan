name: Publish APK Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-apk-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare asset
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk "Langhuan-${{ steps.version.outputs.version }}.apk"

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Langhuan-$VERSION.apk" --clobber
          else
            gh release create "$TAG" "Langhuan-$VERSION.apk" \
              --target "$GITHUB_SHA" \
              --title "琅嬛 $VERSION" \
              --notes "琅嬛 $VERSION 自动构建。公开 Release APK，无需登录 GitHub 即可下载。" \
              --prerelease
          fi
