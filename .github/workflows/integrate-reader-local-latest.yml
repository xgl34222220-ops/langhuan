name: Integrate local reader with latest main

on:
  push:
    branches: [fix/reader-local-latest-integration]
    paths:
      - '.github/workflows/integrate-reader-local-latest.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Merge latest main and fix reader/blueprint integration
        shell: bash
        run: |
          git config user.name "xgl34222220-ops"
          git config user.email "xgl34222220@gmail.com"
          git fetch origin main
          git merge -X ours origin/main --no-edit

          python3 - <<'PY'
          from pathlib import Path
          import re

          def one(s, old, new, label):
              if old not in s:
                  raise AssertionError(f"{label}: expected source not found")
              return s.replace(old, new, 1)

          # Blueprint: a clean partial checkpoint must continue from 1/3 or 2/3, not restart from 0.
          p = Path('app/src/main/java/com/xiguli/langhuan/ui/CreationChatV4.kt')
          s = p.read_text()
          s = one(
              s,
              'viewModel.generateFoundation(regenerate = state.foundation != null || state.blueprintDirty)',
              'viewModel.generateFoundation(regenerate = state.blueprintDirty || state.foundationStage >= 3)',
              'blueprint continue semantics',
          )
          p.write_text(s)

          # Reader progress is written on every settled page. commit() fsyncs synchronously and can
          # hitch the UI thread; apply() updates memory immediately and flushes asynchronously.
          p = Path('app/src/main/java/com/xiguli/langhuan/ui/ReaderReadingStateV11.kt')
          s = p.read_text()
          s = one(
              s,
              '.putLong("updated_$bookId", System.currentTimeMillis())\n            .commit()',
              '.putLong("updated_$bookId", System.currentTimeMillis())\n            .apply()',
              'async reader progress',
          )
          p.write_text(s)

          # Qingmo V13: do not paginate/render the previous and next entire chapters just to create
          # synthetic boundary pages. This was expensive and also let a PagerState own pages from
          # two chapter identities. Keep one Pager == one chapter and hand off only at the edge.
          p = Path('app/src/main/java/com/xiguli/langhuan/ui/reader/ReaderQingmoHeroV13.kt')
          s = p.read_text()

          imports = {
              'import androidx.compose.ui.Alignment\n': 'import androidx.compose.ui.Alignment\nimport androidx.compose.ui.geometry.Offset\n',
              'import androidx.compose.ui.input.key.type\n': 'import androidx.compose.ui.input.key.type\nimport androidx.compose.ui.input.nestedscroll.NestedScrollConnection\nimport androidx.compose.ui.input.nestedscroll.NestedScrollSource\nimport androidx.compose.ui.input.nestedscroll.nestedScroll\n',
              'import androidx.compose.ui.unit.dp\n': 'import androidx.compose.ui.unit.Velocity\nimport androidx.compose.ui.unit.dp\n',
              'import kotlin.math.absoluteValue\n': 'import kotlin.math.absoluteValue\nimport kotlin.math.abs\n',
          }
          for old, new in imports.items():
              if new.strip() not in s:
                  s = one(s, old, new, f'import {new.strip()}')

          s, count = re.subn(
              r'''\n    val previousTitle = remember\(previous\?\.id, previous\?\.title\) \{ previous\?\.let\(::chapterTitle\)\.orEmpty\(\) \}\n    val previousText = remember\(previous\?\.id, previous\?\.content\) \{ previous\?\.let\(::chapterText\)\.orEmpty\(\) \}\n    val nextTitle = remember\(next\?\.id, next\?\.title\) \{ next\?\.let\(::chapterTitle\)\.orEmpty\(\) \}\n    val nextText = remember\(next\?\.id, next\?\.content\) \{ next\?\.let\(::chapterText\)\.orEmpty\(\) \}\n''',
              '\n',
              s,
              count=1,
          )
          if count != 1:
              raise AssertionError('adjacent chapter text cache block not found')

          s, count = re.subn(
              r'''\n    val previousPagination = rememberReaderPaginationV18\(.*?\n    \)\n    val nextPagination = rememberReaderPaginationV18\(.*?\n    \)\n''',
              '\n',
              s,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise AssertionError('adjacent pagination block not found')

          s, count = re.subn(
              r'''\n    val previousPages = previousPagination\.pages\.ifEmpty \{ listOf\(previousText\) \}\n    val previousStarts = previousPagination\.pageStartsParagraph\.ifEmpty \{ listOf\(true\) \}\n    val nextPages = nextPagination\.pages\.ifEmpty \{ listOf\(nextText\) \}\n    val nextStarts = nextPagination\.pageStartsParagraph\.ifEmpty \{ listOf\(true\) \}\n''',
              '\n',
              s,
              count=1,
          )
          if count != 1:
              raise AssertionError('adjacent page lists not found')

          old_pager_model = '''    val leadingBoundary = if (pageMode != ReaderPageModeV10.SCROLL && previous != null) 1 else 0
              val trailingBoundary = if (pageMode != ReaderPageModeV10.SCROLL && next != null) 1 else 0
              val pagerPageCount = (leadingBoundary + pages.size + trailingBoundary).coerceAtLeast(1)
              val initialPagerPage = (initialPage + leadingBoundary).coerceIn(0, pagerPageCount - 1)
              val pagerState = rememberPagerState(initialPage = initialPagerPage, pageCount = { pagerPageCount })'''.replace('\n              ', '\n    ')
          new_pager_model = '''    val pagerPageCount = pages.size.coerceAtLeast(1)
              val pagerState = rememberPagerState(
                  initialPage = initialPage.coerceIn(0, pagerPageCount - 1),
                  pageCount = { pagerPageCount },
              )'''.replace('\n              ', '\n    ')
          s = one(s, old_pager_model, new_pager_model, 'single chapter pager model')
          s = one(
              s,
              '    fun currentPage(): Int = (pagerState.settledPage - leadingBoundary).coerceIn(0, pages.lastIndex)',
              '    fun currentPage(): Int = pagerState.settledPage.coerceIn(0, pages.lastIndex)',
              'current page without synthetic boundary',
          )

          old_page_nav = '''    fun previousPage() {
              if (pageMode == ReaderPageModeV10.SCROLL) return
              val target = pagerState.settledPage - 1
              if (target >= 0) {
                  scope.launch {
                      if (clickAnimation) pagerState.animateScrollToPage(target) else pagerState.scrollToPage(target)
                  }
              } else jumpChapter(previous, true)
          }
          
              fun nextPage() {
              if (pageMode == ReaderPageModeV10.SCROLL) return
              val target = pagerState.settledPage + 1
              if (target < pagerPageCount) {
                  scope.launch {
                      if (clickAnimation) pagerState.animateScrollToPage(target) else pagerState.scrollToPage(target)
                  }
              } else jumpChapter(next, false)
          }'''.replace('\n              ', '\n    ')
          new_page_nav = '''    fun previousPage() {
              if (pageMode == ReaderPageModeV10.SCROLL) return
              val page = currentPage()
              if (page > 0) {
                  scope.launch {
                      if (clickAnimation) pagerState.animateScrollToPage(page - 1) else pagerState.scrollToPage(page - 1)
                  }
              } else jumpChapter(previous, atEnd = true)
          }
          
              fun nextPage() {
              if (pageMode == ReaderPageModeV10.SCROLL) return
              val page = currentPage()
              if (page < pages.lastIndex) {
                  scope.launch {
                      if (clickAnimation) pagerState.animateScrollToPage(page + 1) else pagerState.scrollToPage(page + 1)
                  }
              } else jumpChapter(next, atEnd = false)
          }'''.replace('\n              ', '\n    ')
          s = one(s, old_page_nav, new_page_nav, 'tap chapter boundary navigation')

          s = one(
              s,
              '    LaunchedEffect(layoutKey, pages.size, scrollState.maxValue, leadingBoundary) {',
              '    LaunchedEffect(layoutKey, pages.size, scrollState.maxValue) {',
              'layout effect keys',
          )
          s = one(
              s,
              '            pagerState.scrollToPage((page + leadingBoundary).coerceIn(0, pagerPageCount - 1))',
              '            pagerState.scrollToPage(page.coerceIn(0, pagerPageCount - 1))',
              'layout reposition page',
          )

          old_settle = '''    LaunchedEffect(chapter.id, pageMode, layoutKey, leadingBoundary, trailingBoundary, pages.size) {
              if (pageMode != ReaderPageModeV10.SCROLL) {
                  snapshotFlow { pagerState.settledPage }.distinctUntilChanged().collect { settled ->
                      when {
                          previous != null && leadingBoundary == 1 && settled == 0 -> jumpChapter(previous, true)
                          next != null && trailingBoundary == 1 && settled == leadingBoundary + pages.size -> jumpChapter(next, false)
                          else -> persist()
                      }
                  }
              }
          }'''.replace('\n              ', '\n    ')
          new_settle = '''    LaunchedEffect(chapter.id, pageMode, layoutKey, pages.size) {
              if (pageMode != ReaderPageModeV10.SCROLL) {
                  snapshotFlow { pagerState.settledPage }.distinctUntilChanged().collect { persist() }
              }
          }'''.replace('\n              ', '\n    ')
          s = one(s, old_settle, new_settle, 'settled page persistence')

          # Edge drag is the only cross-chapter gesture. It never inserts another chapter into this Pager.
          insert_before = '    Box(\n        Modifier\n            .fillMaxSize()\n            .background(palette.page)'
          edge_code = '''    val edgeThresholdPx = with(androidx.compose.ui.platform.LocalDensity.current) { 52.dp.toPx() }
              val edgeSwipe = remember(chapter.id, pages.size, pageMode, previous?.id, next?.id) {
                  object : NestedScrollConnection {
                      var edgeDrag = 0f
          
                      override fun onPostScroll(consumed: Offset, available: Offset, source: NestedScrollSource): Offset {
                          if (pageMode == ReaderPageModeV10.SCROLL || source != NestedScrollSource.UserInput) return Offset.Zero
                          val page = pagerState.currentPage.coerceIn(0, pages.lastIndex)
                          edgeDrag = when {
                              page == 0 && available.x > 0f -> (edgeDrag + available.x).coerceAtMost(edgeThresholdPx * 2f)
                              page == pages.lastIndex && available.x < 0f -> (edgeDrag + available.x).coerceAtLeast(-edgeThresholdPx * 2f)
                              else -> 0f
                          }
                          return Offset.Zero
                      }
          
                      override suspend fun onPostFling(consumed: Velocity, available: Velocity): Velocity {
                          val drag = edgeDrag
                          edgeDrag = 0f
                          if (abs(drag) >= edgeThresholdPx && !crossingChapter) {
                              when {
                                  drag > 0f && pagerState.currentPage == 0 -> jumpChapter(previous, atEnd = true)
                                  drag < 0f && pagerState.currentPage == pages.lastIndex -> jumpChapter(next, atEnd = false)
                              }
                          }
                          return Velocity.Zero
                      }
                  }
              }
          
          '''.replace('\n              ', '\n    ')
          if insert_before not in s:
              raise AssertionError('root reader Box insertion point not found')
          s = s.replace(insert_before, edge_code + insert_before, 1)

          s = one(
              s,
              '                    modifier = Modifier.fillMaxSize(),\n                    beyondViewportPageCount = 1,',
              '                    modifier = Modifier.fillMaxSize().nestedScroll(edgeSwipe),\n                    beyondViewportPageCount = 1,',
              'attach edge swipe',
          )

          # The pager now contains only current-chapter pages.
          s, count = re.subn(
              r'''                    Box\(transition\.fillMaxSize\(\)\) \{\n                        when \{.*?\n                        \}\n                    \}\n''',
              '''                    Box(transition.fillMaxSize()) {
                          val safe = pagerPage.coerceIn(0, pages.lastIndex)
                          HeroReaderCanvasV13(
                              title = displayTitle,
                              body = pages[safe],
                              pageStartsParagraph = starts.getOrElse(safe) { true },
                              page = safe + 1,
                              pageCount = pages.size,
                              fontSize = fontSize,
                              lineFactor = lineFactor,
                              paragraphSpacing = paragraphSpacing,
                              sidePadding = sidePadding,
                              firstLineIndent = firstLineIndent,
                              family = family,
                              palette = palette,
                              showTimeBattery = showTimeBattery,
                          )
                      }
'''.replace('\n                          ', '\n                        '),
              s,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise AssertionError('synthetic boundary render block not found')
          p.write_text(s)

          # Version tracks the integrated build rather than the older local-only branch.
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = one(s, 'versionCode = 96', 'versionCode = 97', 'version code')
          s = one(s, 'versionName = "0.28.0-alpha17-wirefix-spatial2"', 'versionName = "0.28.0-alpha18-reader-integration"', 'version name')
          p.write_text(s)

          Path('app/src/test/java/com/xiguli/langhuan/ui/ReaderLocalLatestIntegrationTest.kt').write_text('''package com.xiguli.langhuan.ui

import java.io.File
import org.junit.Assert.assertFalse
import org.junit.Assert.assertTrue
import org.junit.Test

class ReaderLocalLatestIntegrationTest {
    private fun source(path: String) = File(path).readText()

    @Test
    fun productionStillUsesLocalQingmoReaderAndChapterIsolation() {
        val main = source("app/src/main/java/com/xiguli/langhuan/MainActivity.kt")
        val root = source("app/src/main/java/com/xiguli/langhuan/ui/LanghuanRootV4.kt")
        val native = source("app/src/main/java/com/xiguli/langhuan/ui/reader/ReaderNativeExperienceV4.kt")
        val reader = source("app/src/main/java/com/xiguli/langhuan/ui/reader/ReaderQingmoHeroV13.kt")
        assertTrue(main.contains("LanghuanRootV4"))
        assertTrue(root.contains("ReaderNativeExperienceV4("))
        assertTrue(native.contains("key(chapterKey)"))
        assertTrue(reader.contains("jumpChapter(previous, atEnd = true)"))
        assertTrue(reader.contains("jumpChapter(next, atEnd = false)"))
    }

    @Test
    fun pagerOwnsOnlyCurrentChapterAndProgressDoesNotFsyncEveryPage() {
        val reader = source("app/src/main/java/com/xiguli/langhuan/ui/reader/ReaderQingmoHeroV13.kt")
        val progress = source("app/src/main/java/com/xiguli/langhuan/ui/ReaderReadingStateV11.kt")
        assertFalse(reader.contains("previousPagination = rememberReaderPaginationV18"))
        assertFalse(reader.contains("nextPagination = rememberReaderPaginationV18"))
        assertFalse(reader.contains("leadingBoundary"))
        assertFalse(reader.contains("trailingBoundary"))
        assertTrue(reader.contains("nestedScroll(edgeSwipe)"))
        assertTrue(progress.contains(".putLong(\"updated_$bookId\", System.currentTimeMillis())\n            .apply()"))
    }

    @Test
    fun latestCreationAndBlueprintFixesAreInTheSameBuild() {
        val creation = source("app/src/main/java/com/xiguli/langhuan/ui/CreationChatV4.kt")
        val conversation = source("app/src/main/java/com/xiguli/langhuan/ui/NewBookConversation.kt")
        assertTrue(creation.contains("CreationErrorPanelV4"))
        assertTrue(creation.contains("retryLastTurn"))
        assertTrue(creation.contains("state.blueprintDirty || state.foundationStage >= 3"))
        assertTrue(conversation.contains("当前有效蓝图已经保存"))
        assertTrue(conversation.contains("runningFoundation.cancel()"))
        assertTrue(conversation.contains("if (stage < 1)"))
    }
}
''')
          PY

      - name: Verify
        run: |
          git diff --check
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Commit integrated result
        shell: bash
        run: |
          git add app
          git diff --cached --check
          git commit -m "fix: integrate local reader with latest creation pipeline"
          git push origin HEAD:fix/reader-local-latest-integration
