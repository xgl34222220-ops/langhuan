name: Integrate local reader with latest main

on:
  push:
    branches: [fix/reader-local-latest-integration]
    paths:
      - '.github/workflows/integrate-reader-local-latest.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Merge latest main
        run: |
          git config user.name "xgl34222220-ops"
          git config user.email "xgl34222220@gmail.com"
          git fetch origin main
          git merge -X ours origin/main --no-edit

      - name: Apply reader and blueprint integration fixes
        run: python3 .github/scripts/integrate_reader_local.py

      - name: Verify
        run: |
          git diff --check
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Commit integrated result
        run: |
          git add app
          git diff --cached --check
          git commit -m "fix: integrate local reader with latest creation pipeline"
          git push origin HEAD:fix/reader-local-latest-integration
