name: Apply Author Preference Learning

on:
  push:
    paths:
      - ".github/scripts/apply_author_profile.py"
      - ".github/workflows/apply-author-profile.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python .github/scripts/apply_author_profile.py
      - name: Validate patch
        run: git diff --check
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: learn author editing preferences"
          git push
