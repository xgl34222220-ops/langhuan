name: Apply Style Template Patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/patches/style-template-selector.patch'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: git apply --recount --whitespace=fix .github/patches/style-template-selector.patch
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/xiguli/langhuan/ui/NewBookConversation.kt \
                  app/src/main/java/com/xiguli/langhuan/ui/ProgressiveFoundationEngine.kt \
                  app/src/main/java/com/xiguli/langhuan/ui/ResearchNewBookConversationPage.kt
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "feat: select distilled Style DNA per creation session"
            git push origin HEAD:main
          fi
