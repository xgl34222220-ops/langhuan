name: Apply Candidate Canon

on:
  push:
    branches: [stage/candidate-canon-0263]
    paths:
      - '.github/scripts/apply_candidate_canon.py'
      - '.github/workflows/apply-candidate-canon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/candidate-canon-0263
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/apply_candidate_canon.py
      - name: Validate patch
        run: |
          grep -q 'CandidateCanonEngine.stage' app/src/main/java/com/xiguli/langhuan/ui/StudioViewModel.kt
          grep -q 'CandidateCanonPanel(state, vm)' app/src/main/java/com/xiguli/langhuan/ui/AgentPage.kt
          grep -q '加入候选事实' app/src/main/java/com/xiguli/langhuan/ui/AgentPage.kt
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/xiguli/langhuan/ui/StudioViewModel.kt app/src/main/java/com/xiguli/langhuan/ui/AgentPage.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: wire candidate canon into Agent flow'
          git push origin HEAD:stage/candidate-canon-0263
