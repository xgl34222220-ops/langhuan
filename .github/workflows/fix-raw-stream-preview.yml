name: Fix Raw Stream Preview

on:
  push:
    branches: [stage/run-inspector-streaming-0264]
    paths:
      - 'tools/fix_raw_stream_preview.py'
      - '.github/workflows/fix-raw-stream-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/run-inspector-streaming-0264
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fix_raw_stream_preview.py
      - name: Validate
        run: |
          grep -q 'structuredJson: Boolean' app/src/main/java/com/xiguli/langhuan/engine/UniversalAiGateway.kt
          grep -q 'else buffer.toString()' app/src/main/java/com/xiguli/langhuan/engine/UniversalAiGateway.kt
          test "$(grep -c 'appendDelta(buffer, delta, onDelta, prompt.jsonMode)' app/src/main/java/com/xiguli/langhuan/engine/UniversalAiGateway.kt)" = "4"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/xiguli/langhuan/engine/UniversalAiGateway.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: stream raw prose and chat text to UI'
          git push origin HEAD:stage/run-inspector-streaming-0264
