name: Patch Writing Flow Streaming

on:
  push:
    branches: [stage/run-inspector-streaming-0264]
    paths:
      - 'tools/patch_writing_flow_streaming.py'
      - '.github/workflows/patch-writing-flow-streaming.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/run-inspector-streaming-0264
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply writing flow patch
        run: python tools/patch_writing_flow_streaming.py
      - name: Validate wiring
        run: |
          grep -q 'retrieveRelevantContext' app/src/main/java/com/xiguli/langhuan/ui/WritingFlowViewModel.kt
          grep -q 'onRunEvent = ::emitRun' app/src/main/java/com/xiguli/langhuan/ui/WritingFlowViewModel.kt
          grep -q 'CandidateCanonEngine.stage' app/src/main/java/com/xiguli/langhuan/ui/WritingFlowViewModel.kt
          ! grep -q 'AgentMemoryApplier' app/src/main/java/com/xiguli/langhuan/ui/WritingFlowViewModel.kt
          grep -q 'RunInspectorPanel(state.runEvents' app/src/main/java/com/xiguli/langhuan/ui/WritingFlowPage.kt
          grep -q '确认进 Canon' app/src/main/java/com/xiguli/langhuan/ui/WritingFlowPage.kt
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/xiguli/langhuan/ui/WritingFlowViewModel.kt \
                  app/src/main/java/com/xiguli/langhuan/ui/WritingFlowPage.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: unify writing flow with streaming and Candidate Canon'
          git push origin HEAD:stage/run-inspector-streaming-0264
