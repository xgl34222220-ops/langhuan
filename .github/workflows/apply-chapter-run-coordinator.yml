name: Apply Chapter Run Coordinator

on:
  push:
    branches:
      - stage/chapter-run-coordinator-0265
    paths:
      - tools/apply_chapter_run_coordinator.py
      - .github/workflows/apply-chapter-run-coordinator.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/chapter-run-coordinator-0265
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migration
        run: python tools/apply_chapter_run_coordinator.py
      - name: Validate single execution kernel
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/xiguli/langhuan/engine/ChapterRunCoordinator.kt
          grep -q 'ChapterRunCoordinator(AppChapterRunStore(repository, projects))' app/src/main/java/com/xiguli/langhuan/ui/StudioViewModel.kt
          grep -q 'ChapterRunCoordinator(AppChapterRunStore(repository, projects))' app/src/main/java/com/xiguli/langhuan/ui/WritingFlowViewModel.kt
          ! grep -q 'GenerationPipeline(' app/src/main/java/com/xiguli/langhuan/ui/StudioViewModel.kt
          ! grep -q 'GenerationPipeline(' app/src/main/java/com/xiguli/langhuan/ui/WritingFlowViewModel.kt
          ! grep -q 'retrieveRelevantContext(' app/src/main/java/com/xiguli/langhuan/ui/StudioViewModel.kt
          ! grep -q 'retrieveRelevantContext(' app/src/main/java/com/xiguli/langhuan/ui/WritingFlowViewModel.kt
          ! grep -q 'CandidateCanonEngine' app/src/main/java/com/xiguli/langhuan/ui/StudioViewModel.kt
          ! grep -q 'CandidateCanonEngine' app/src/main/java/com/xiguli/langhuan/ui/WritingFlowViewModel.kt
          grep -q 'versionCode = 63' app/build.gradle.kts
          grep -q 'versionName = "0.26.5-alpha01"' app/build.gradle.kts
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/xiguli/langhuan/ui/StudioViewModel.kt \
                  app/src/main/java/com/xiguli/langhuan/ui/WritingFlowViewModel.kt \
                  app/build.gradle.kts
          git commit -m 'refactor: route all chapter runs through coordinator'
          git push origin HEAD:stage/chapter-run-coordinator-0265
