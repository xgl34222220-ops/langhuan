name: Apply alpha25 reader preference migration

on:
  push:
    branches: [fix/reader-alpha25-layout-transition]
    paths:
      - '.github/workflows/alpha25-reader-migration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reader-alpha25-layout-transition
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Migrate untouched alpha22 defaults
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/xiguli/langhuan/ui/reader/ReaderQingmoHeroV13.kt')
          s = path.read_text()
          old = '''    val initialLine = if (densityMigrationNeeded) 1.56f else legacyLine
    val initialParagraph = if (densityMigrationNeeded) 0f else legacyParagraph
    val initialSide = if (densityMigrationNeeded) 18f else legacySide

    var fontSize by remember(book.id) { mutableFloatStateOf(legacyFont) }
    var lineFactor by remember(book.id) { mutableFloatStateOf(initialLine) }
    var paragraphSpacing by remember(book.id) { mutableFloatStateOf(initialParagraph) }
    var sidePadding by remember(book.id) { mutableFloatStateOf(initialSide) }'''
          new = '''    val layoutV25MigrationNeeded = remember(book.id) {
        !prefs.getBoolean("reader_layout_v25", false) &&
            legacyFont == 18f && legacyLine == 1.56f && legacyParagraph == 0f && legacySide == 18f &&
            legacyPreset in setOf("qingmo", "langhuan")
    }
    val initialFont = if (layoutV25MigrationNeeded) 17.5f else legacyFont
    val initialLine = when {
        layoutV25MigrationNeeded -> 1.48f
        densityMigrationNeeded -> 1.56f
        else -> legacyLine
    }
    val initialParagraph = if (densityMigrationNeeded || layoutV25MigrationNeeded) 0f else legacyParagraph
    val initialSide = when {
        layoutV25MigrationNeeded -> 16f
        densityMigrationNeeded -> 18f
        else -> legacySide
    }

    var fontSize by remember(book.id) { mutableFloatStateOf(initialFont) }
    var lineFactor by remember(book.id) { mutableFloatStateOf(initialLine) }
    var paragraphSpacing by remember(book.id) { mutableFloatStateOf(initialParagraph) }
    var sidePadding by remember(book.id) { mutableFloatStateOf(initialSide) }'''
          if old not in s:
              raise SystemExit('missing alpha22 init block')
          s = s.replace(old, new, 1)

          marker = '''    LaunchedEffect(book.id) {
        if (!prefs.getBoolean("reader_density_v22", false)) {
            val edit = prefs.edit().putBoolean("reader_density_v22", true)
            if (densityMigrationNeeded) {
                edit.putFloat("line", 1.56f)
                    .putFloat("paragraph", 0f)
                    .putFloat("sidePadding", 18f)
            }
            edit.apply()
        }
    }'''
          replacement = marker + '''
    LaunchedEffect(book.id, layoutV25MigrationNeeded) {
        if (!prefs.getBoolean("reader_layout_v25", false)) {
            val edit = prefs.edit().putBoolean("reader_layout_v25", true)
            if (layoutV25MigrationNeeded) {
                edit.putFloat("font", 17.5f)
                    .putFloat("line", 1.48f)
                    .putFloat("paragraph", 0f)
                    .putFloat("sidePadding", 16f)
            }
            edit.apply()
        }
    }'''
          if marker not in s:
              raise SystemExit('missing alpha22 migration block')
          s = s.replace(marker, replacement, 1)
          path.write_text(s)
          PY
          git config user.name "xgl34222220-ops"
          git config user.email "xgl34222220@gmail.com"
          git add app/src/main/java/com/xiguli/langhuan/ui/reader/ReaderQingmoHeroV13.kt
          git commit -m "fix: migrate untouched reader defaults to alpha25"
          git push origin HEAD:fix/reader-alpha25-layout-transition
