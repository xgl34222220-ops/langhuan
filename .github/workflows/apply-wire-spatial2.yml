name: Apply wire compatibility and spatial UI phase 2

on:
  push:
    branches: ['fix/wire-compat-spatial2']
    paths:
      - '.github/workflows/apply-wire-spatial2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Apply patch
        run: python3 tools/apply_wire_spatial2.py
      - name: Test and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Commit result
        shell: bash
        run: |
          git config user.name 'xgl34222220-ops'
          git config user.email 'xgl34222220@gmail.com'
          git add -A
          git commit -m 'fix: broaden AI wire compatibility and spatialize active creation'
          git push origin HEAD:fix/wire-compat-spatial2
