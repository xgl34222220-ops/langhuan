name: Apply research switch v2

on:
  push:
    branches: [main]
    paths:
      - tools/apply_research_switch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply_research_switch.py
      - name: Commit patch
        run: |
          git config user.name "xgl34222220-ops"
          git config user.email "xgl34222220@gmail.com"
          git add app/src/main/java/com/xiguli/langhuan/ui/ResearchNewBookConversationPage.kt app/src/main/java/com/xiguli/langhuan/engine/WebResearchEngine.kt app/build.gradle.kts
          git commit -m "fix: add explicit web research switch"
          git push origin HEAD:main
