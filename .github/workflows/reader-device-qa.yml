name: Reader device QA
on:
  push:
    branches: [test/reader-edition-20260930]
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/xiguli/langhuan/ui/**'
      - 'app/src/androidTest/**'
      - '.github/workflows/reader-device-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build device tests
        run: |
          python3 -m unittest tools/test_instrumentation_verifier.py
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: |
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb shell settings put secure immersive_mode_confirmations confirmed
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.sourceFixtureBase="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/app/src/androidTest/assets/source-fixture/" || { adb pull /sdcard/Download/reader-qa reader-qa; adb pull /sdcard/Android/data/com.xiguli.langhuan/files/epub-evidence reader-qa/epub-artwork || true; exit 1; }
            python3 tools/verify_epub_process_death.py --evidence reader-qa/epub-process || { adb pull /sdcard/Download/reader-qa reader-qa; adb pull /sdcard/Android/data/com.xiguli.langhuan/files/epub-evidence reader-qa/epub-artwork || true; exit 1; }
            adb pull /sdcard/Android/data/com.xiguli.langhuan/files/epub-evidence reader-qa/epub-artwork
            adb pull /sdcard/Download/reader-qa reader-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-device-qa
          path: |
            reader-qa
            app/build/reports/androidTests
