name: Reader device QA
on:
  push:
    branches: [test/reader-edition-20260930]
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/xiguli/langhuan/ui/**'
      - 'app/src/androidTest/**'
      - 'tools/run_reader_device_checks.sh'
      - 'tools/verify_epub_process_death.py'
      - 'tools/reader_device_retry_plan.py'
      - '.github/workflows/reader-device-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build device tests
        run: |
          python3 -m unittest tools/test_instrumentation_verifier.py
          python3 -m unittest tools/test_reader_device_retry_plan.py
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          ram-size: 4096M
          emulator-boot-timeout: 900
          script: |
            # Let the freshly booted emulator settle before any device configuration or tests.
            timeout 120s adb wait-for-device
            timeout 300s bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ] && adb shell pm path android >/dev/null 2>&1; do sleep 2; done'
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            sleep 15
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb shell settings put secure immersive_mode_confirmations confirmed
            mkdir -p reader-qa
            # A fresh Google image can leave Launcher ANR after display-density recreation.
            # Reset only the emulator launcher BEFORE tests; retain all app foreground checks.
            adb shell am force-stop com.google.android.apps.nexuslauncher
            timeout 45s adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.HOME
            sleep 5
            adb shell dumpsys window windows > reader-qa/emulator-before-tests-window.txt
            adb exec-out screencap -p > reader-qa/emulator-before-tests.png
            if rg -q 'Application Not Responding:' reader-qa/emulator-before-tests-window.txt; then exit 1; fi
            # Keep only this CI emulator installation for artwork collection and the two process phases.
            bash tools/run_reader_device_checks.sh "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/app/src/androidTest/assets/source-fixture/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-device-qa
          path: |
            reader-qa
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
