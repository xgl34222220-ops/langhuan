name: Reader device QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/xiguli/langhuan/ui/**'
      - 'app/src/androidTest/**'
      - '.github/workflows/reader-device-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build device tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: |
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb shell settings put secure immersive_mode_confirmations confirmed
            gradle --no-daemon :app:connectedDebugAndroidTest || { adb pull /sdcard/Download/reader-qa reader-qa; exit 1; }
            adb pull /sdcard/Download/reader-qa reader-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-device-qa
          path: |
            reader-qa
            app/build/reports/androidTests
