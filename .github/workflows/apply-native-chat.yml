name: Apply native chat refactor

on:
  push:
    branches: [main]
    paths:
      - tools/apply_native_chat.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply native chat refactor
        run: python3 tools/apply_native_chat.py
      - name: Commit refactor
        run: |
          git config user.name "xgl34222220-ops"
          git config user.email "xgl34222220@gmail.com"
          git add app/src/main/java/com/xiguli/langhuan/engine/PromptAssembler.kt \
                  app/src/main/java/com/xiguli/langhuan/engine/GenerationPipeline.kt \
                  app/src/main/java/com/xiguli/langhuan/engine/UniversalAiGateway.kt \
                  app/src/main/java/com/xiguli/langhuan/ui/NewBookConversation.kt \
                  app/src/main/java/com/xiguli/langhuan/ui/ResearchNewBookConversationPage.kt \
                  app/build.gradle.kts
          git commit -m "feat: make new-book chat native and tool-driven"
          git push origin HEAD:main
