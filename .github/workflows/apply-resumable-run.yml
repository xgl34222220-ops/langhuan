name: Apply Resumable Run

on:
  push:
    branches: [stage/resumable-run-0266]
    paths:
      - tools/apply_resumable_run.py
      - .github/workflows/apply-resumable-run.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/resumable-run-0266
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply resumable run migration
        run: python tools/apply_resumable_run.py
      - name: Validate durable run architecture
        run: |
          grep -q 'class PersistentChapterRunCheckpointStore' app/src/main/java/com/xiguli/langhuan/engine/ChapterRunCheckpointStore.kt
          grep -q 'lastCommittedRunId' app/src/main/java/com/xiguli/langhuan/domain/StoryModels.kt
          grep -q 'resumeCheckpoint: GenerationStageCheckpoint' app/src/main/java/com/xiguli/langhuan/engine/GenerationPipeline.kt
          grep -q 'versionName = "0.26.6-alpha01"' app/build.gradle.kts
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add crash-safe resumable chapter runs'
          git push origin HEAD:stage/resumable-run-0266
